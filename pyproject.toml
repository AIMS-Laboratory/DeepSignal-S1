[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsignal-s1-demo"
version = "0.2.0"
description = "Visual traffic-signal control demonstration and simulation tests"
requires-python = ">=3.10,<3.11"
dependencies = ["traci>=1.18", "sumolib>=1.18", "numpy>=1.24", "opencv-python-headless>=4.8", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]
download = ["huggingface_hub>=1.0"]
baseline = ["ultralytics>=8.3", "fastapi>=0.115", "uvicorn>=0.30"]
reproduction = ["lxml>=5"]
plots = ["matplotlib>=3.9"]

[project.scripts]
deepsignal-s1 = "deepsignal_s1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
