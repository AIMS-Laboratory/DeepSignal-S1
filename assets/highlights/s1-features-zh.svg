<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 415" role="img" aria-labelledby="title desc">
<title id="title">视觉直达决策 · 抗干扰 · 快速响应</title><desc id="desc">受控仿真结果；延迟仅指模型请求。BF16 / RTX 5090；完整比较与测试条件见下文。</desc>
<rect width="1200" height="415" rx="18" fill="#F5F8FB"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<text x="30" y="39" font-size="17" fill="#526577">DeepSignal S1 / 核心创新与特色</text>
<text x="30" y="85" font-size="34" font-weight="700" fill="#132E41">视觉直达决策 · 抗干扰 · 快速响应</text>
<rect x="30" y="112" width="360" height="239" rx="12" fill="#E9F6F4"/>
<rect x="30" y="134" width="4" height="26" rx="2" fill="#087F8C"/>
<text x="50" y="153" font-size="17" font-weight="700" fill="#087F8C">01  模型设计</text>
<text x="50" y="212" font-size="29" font-weight="700" fill="#132E41">画面 → 动作</text>
<text x="50" y="252" font-size="19" font-weight="400" fill="#243F50">同一模型理解画面并选择动作</text>
<text x="50" y="296" font-size="17" font-weight="400" fill="#526577">连续三帧 + 路口与信号状态</text>
<text x="50" y="325" font-size="17" font-weight="400" fill="#526577">直接输出合法动作及候选概率</text>
<rect x="420" y="112" width="360" height="239" rx="12" fill="#EDF2FC"/>
<rect x="420" y="134" width="4" height="26" rx="2" fill="#315CA8"/>
<text x="440" y="153" font-size="17" font-weight="700" fill="#315CA8">02  控制特色</text>
<text x="440" y="212" font-size="29" font-weight="700" fill="#132E41">4 类视觉干扰</text>
<text x="440" y="252" font-size="19" font-weight="400" fill="#243F50">失焦 · 模糊 · 偏移 · 抖动</text>
<text x="440" y="296" font-size="17" font-weight="400" fill="#526577">两组仿真场景的已测条件下</text>
<text x="440" y="325" font-size="17" font-weight="400" fill="#526577">等待、排队、行程均优于 YOLO+MP</text>
<rect x="810" y="112" width="360" height="239" rx="12" fill="#F3EDF9"/>
<rect x="810" y="134" width="4" height="26" rx="2" fill="#6E4AA2"/>
<text x="830" y="153" font-size="17" font-weight="700" fill="#6E4AA2">03  响应速度</text>
<text x="830" y="212" font-size="32" font-weight="700" fill="#132E41">平均 485毫秒</text>
<text x="830" y="252" font-size="24" font-weight="400" fill="#243F50"><tspan font-weight="700">99.08%</tspan> 低于一秒</text>
<text x="830" y="296" font-size="17" font-weight="400" fill="#526577">未量化 BF16 · RTX 5090</text>
<text x="830" y="325" font-size="17" font-weight="400" fill="#526577">统计 6,823 次模型请求</text>
<text x="30" y="387" font-size="17" fill="#526577">受控仿真结果；延迟仅指模型请求。BF16 / RTX 5090；完整比较与测试条件见下文。</text>
</g></svg>
